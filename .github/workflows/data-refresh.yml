name: Data Refresh

on:
  schedule:
    - cron: "0 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch and transform sheet data
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: |
          echo "[data-refresh] Starting"
          node scripts/fetch-sheet.mjs
          echo "[data-refresh] Completed"

      - name: Commit and push if data changed
        run: |
          if [[ -n "$(git status --porcelain data/shredders.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/shredders.json
            git commit -m "chore(data): refresh shredders json"
            git push
          else
            echo "No data changes detected"
          fi
